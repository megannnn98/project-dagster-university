name: Russian Dagster University — GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'course/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'course/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DAGSTER_STATIC_EXPORT: '1'
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      NEXT_TELEMETRY_DISABLED: '1'
    defaults:
      run:
        working-directory: course
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: node .yarn/releases/yarn-4.5.0.cjs install --immutable
      - name: Lint
        run: node .yarn/releases/yarn-4.5.0.cjs lint
      - name: Check source links
        run: node .yarn/releases/yarn-4.5.0.cjs exec ts-node -O '{"module":"commonjs"}' scripts/check-internal-links.ts
      - name: Build static site
        run: node .yarn/releases/yarn-4.5.0.cjs build
      - name: Verify exported routes and assets
        run: python3 scripts/check-pages-export.py out "$NEXT_PUBLIC_BASE_PATH"
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: course/out

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
